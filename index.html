<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文青轉盤 App</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <style>
        /* ==================== 基礎設定與配色 ==================== */
        :root {
            --bg-color: #F5F4F0;      /* 燕麥米白 */
            --primary-color: #8C9A9E; /* 莫蘭迪藍灰 */
            --accent-color: #C2B4A6;  /* 拿鐵大地色 */
            --text-main: #4A4A4A;     /* 柔和深灰 */
            --nav-bg: #FFFFFF;        /* 底部導覽列背景 */
            --danger-color: #D98C8C;  /* 柔和磚紅 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent; /* 隱藏點擊高光 */
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* 絕對防護：禁止全局滾動條 */
            font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang TC', '微軟正黑體', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        /* ==================== 佈局區塊 ==================== */
        header {
            height: 60px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            letter-spacing: 2px;
        }

        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        nav {
            height: 70px;
            flex-shrink: 0;
            background-color: var(--nav-bg);
            border-top: 1px solid #EAE8E3;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 0.75rem;
            cursor: pointer;
            width: 60px;
            height: 100%;
            transition: color 0.2s;
            gap: 4px;
        }

        .nav-btn:hover, .nav-btn:active {
            color: var(--accent-color);
        }

        /* ==================== 轉盤與指針 ==================== */
        .wheel-wrapper {
            position: relative;
            width: 90vw;
            max-width: 350px;
            aspect-ratio: 1 / 1;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--text-main);
            z-index: 10;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            cursor: pointer;
        }

        /* ==================== 彈出式視窗 (Modal) ==================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(74, 74, 74, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            max-height: 80vh; /* 防止內容過多超出螢幕 */
        }

        .modal-header {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .close-icon {
            cursor: pointer;
            color: var(--text-main);
        }

        .add-item-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .add-item-group input {
            flex-grow: 1; padding: 10px; border: 1px solid var(--accent-color);
            border-radius: 8px; font-size: 1rem; outline: none;
        }
        .btn-primary {
            background-color: var(--primary-color); color: #FFF;
            border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer;
            font-weight: bold; width: 100%;
        }
        .btn-outline {
            background-color: transparent; color: var(--primary-color);
            border: 2px solid var(--primary-color); padding: 10px 16px; border-radius: 8px; 
            cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;
        }

        .item-list {
            flex-grow: 1;
            overflow-y: auto; /* 內部滾動條，保護外層佈局 */
            margin-bottom: 15px;
            padding-right: 5px;
        }

        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid #EAE8E3;
        }

        .icon-btn {
            background: none; border: none; cursor: pointer; display: flex; align-items: center;
        }
        .icon-btn.delete { color: var(--danger-color); }
        
        /* 隱藏的檔案上傳標籤 */
        #fileInput { display: none; }

    </style>
</head>
<body>

    <header>決定轉盤</header>

    <main>
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="800" height="800"></canvas>
        </div>
    </main>

    <nav>
        <button class="nav-btn" onclick="startSpin()">
            <span class="material-symbols-outlined">play_circle</span>
            抽籤
        </button>
        <button class="nav-btn" onclick="openModal('editModal')">
            <span class="material-symbols-outlined">edit_square</span>
            編輯
        </button>
        <button class="nav-btn" onclick="openModal('historyModal')">
            <span class="material-symbols-outlined">history</span>
            歷史
        </button>
        <button class="nav-btn" onclick="openModal('backupModal')">
            <span class="material-symbols-outlined">cloud_sync</span>
            備份
        </button>
    </nav>

    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                編輯清單
                <span class="material-symbols-outlined close-icon" onclick="closeModal('editModal')">close</span>
            </div>
            <div class="add-item-group">
                <input type="text" id="newItemInput" placeholder="輸入新項目..." onkeypress="handleEnter(event)">
                <button class="btn-primary" style="width: auto;" onclick="addItem()">新增</button>
            </div>
            <div id="itemList" class="item-list"></div>
            <button class="btn-primary" onclick="closeModal('editModal')">完成並儲存</button>
        </div>
    </div>

    <div id="historyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                抽籤紀錄
                <span class="material-symbols-outlined close-icon" onclick="closeModal('historyModal')">close</span>
            </div>
            <div id="historyList" class="item-list"></div>
            <button class="btn-outline" onclick="clearHistory()">清空紀錄</button>
        </div>
    </div>

    <div id="backupModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                資料備份
                <span class="material-symbols-outlined close-icon" onclick="closeModal('backupModal')">close</span>
            </div>
            <p style="margin-bottom: 20px; font-size: 0.9rem; text-align: center;">將目前的轉盤清單儲存為檔案，或從先前存檔的檔案還原。</p>
            <button class="btn-primary" onclick="exportData()">匯出清單備份 (.json)</button>
            <button class="btn-outline" onclick="document.getElementById('fileInput').click()">從檔案還原清單</button>
            <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <script>
        // --- 初始化與資料庫 (LocalStorage) ---
        const defaultItems = ["喝咖啡", "看書", "看電影", "散步", "整理房間", "聽音樂"];
        let items = JSON.parse(localStorage.getItem('wheelData')) || defaultItems;
        let historyData = JSON.parse(localStorage.getItem('wheelHistory')) || [];
        
        const colors = ['#8C9A9E', '#C2B4A6', '#D1CFC0', '#A3B1AA', '#E0D4C3'];

        // --- 轉盤繪製邏輯 ---
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        let currentAngle = 0, spinVelocity = 0, isSpinning = false;
        const centerX = canvas.width / 2, centerY = canvas.height / 2, radius = centerX;

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const sliceAngle = (2 * Math.PI) / items.length;

            for (let i = 0; i < items.length; i++) {
                const startAngle = currentAngle + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#FFFFFF';
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 40px 'PingFang TC', sans-serif";
                ctx.fillText(items[i], radius - 50, 0); 
                ctx.restore();
            }
        }

        // --- 旋轉動畫與結果計算 ---
        function animate() {
            currentAngle += spinVelocity;
            spinVelocity *= 0.985; // 阻尼減速
            drawWheel();

            if (spinVelocity < 0.002) {
                isSpinning = false;
                spinVelocity = 0;
                calculateWinner();
                return;
            }
            requestAnimationFrame(animate);
        }

        function startSpin() {
            if (isSpinning || items.length < 2) return;
            isSpinning = true;
            spinVelocity = Math.random() * 0.3 + 0.4; 
            animate();
        }

        function calculateWinner() {
            const sliceAngle = (2 * Math.PI) / items.length;
            const degrees = (currentAngle % (2 * Math.PI)) * (180 / Math.PI);
            const pointerAngle = 270 - degrees;
            const normalizedAngle = (pointerAngle + 360) % 360;
            const winnerIndex = Math.floor(normalizedAngle / (sliceAngle * (180 / Math.PI)));
            
            const winner = items[winnerIndex];
            
            // 記錄到歷史
            const timeString = new Date().toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit'});
            historyData.unshift({ time: timeString, result: winner });
            if(historyData.length > 50) historyData.pop(); // 最多存50筆
            localStorage.setItem('wheelHistory', JSON.stringify(historyData));

            setTimeout(() => { alert(`🎉 抽中了：${winner}`); }, 200);
        }

        // --- Modal 控制與編輯邏輯 ---
        function openModal(id) {
            document.getElementById(id).classList.add('active');
            if(id === 'editModal') renderEditList();
            if(id === 'historyModal') renderHistory();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            if(id === 'editModal') {
                localStorage.setItem('wheelData', JSON.stringify(items));
                drawWheel();
            }
        }

        function renderEditList() {
            const list = document.getElementById('itemList');
            list.innerHTML = items.map((item, index) => `
                <div class="item-row">
                    <span>${item}</span>
                    <button class="icon-btn delete" onclick="deleteItem(${index})">
                        <span class="material-symbols-outlined">delete</span>
                    </button>
                </div>
            `).join('');
        }

        function addItem() {
            const input = document.getElementById('newItemInput');
            const val = input.value.trim();
            if (val) {
                items.push(val);
                input.value = '';
                renderEditList();
            }
        }

        function handleEnter(e) { if(e.key === 'Enter') addItem(); }

        function deleteItem(index) {
            if(items.length <= 2) { alert("至少需要兩個項目喔！"); return; }
            items.splice(index, 1);
            renderEditList();
        }

        // --- 歷史紀錄邏輯 ---
        function renderHistory() {
            const list = document.getElementById('historyList');
            if(historyData.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding: 20px; color: #999;">尚無紀錄</div>';
                return;
            }
            list.innerHTML = historyData.map(h => `
                <div class="item-row">
                    <span style="color: #999; font-size: 0.85rem;">${h.time}</span>
                    <span style="font-weight: bold; color: var(--primary-color);">${h.result}</span>
                </div>
            `).join('');
        }

        function clearHistory() {
            if(confirm('確定要清空所有抽籤紀錄嗎？')) {
                historyData = [];
                localStorage.removeItem('wheelHistory');
                renderHistory();
            }
        }

        // --- 備份與還原邏輯 (JSON) ---
        function exportData() {
            const dataStr = JSON.stringify(items);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `轉盤備份_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if(Array.isArray(imported) && imported.length >= 2) {
                        items = imported;
                        localStorage.setItem('wheelData', JSON.stringify(items));
                        drawWheel();
                        closeModal('backupModal');
                        alert("✅ 還原成功！");
                    } else {
                        alert("❌ 檔案格式不正確或項目過少。");
                    }
                } catch (err) {
                    alert("❌ 讀取檔案失敗，請確認是否為正確的 JSON 備份檔。");
                }
                event.target.value = ''; // 清空 input 讓下次可以選同一個檔案
            };
            reader.readAsText(file);
        }

        // 初始化繪製與事件綁定
        drawWheel();
        canvas.addEventListener('click', startSpin);

    </script>
</body>
</html>
